[project]
name = "conversation-service"
version = "0.1.0"
description = "GraphGPT Conversation Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "cassandra-driver>=3.29.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "alembic>=1.13",
    "httpx",
    "redis",
    "aiokafka",
    "grpcio",
    "grpcio-tools",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "pyjwt",
    "cryptography",
    "cramjam>=2.12.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[kafka,redis,postgres]",
    "psycopg2-binary",
    "httpx"
]
